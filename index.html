<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Match-3 Starter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #1a1a1a;
        --panel: #2a2a2a;
        --accent: #4a90e2;
        --accent-2: #f0b64f;
        --text: #ffffff;
        --muted: #9aa0a6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(160deg, #111111 0%, #1a1a1a 45%, #111111 100%);
        color: var(--text);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        display: grid;
        place-items: center;
      }
      #app {
        width: 880px;
        max-width: 95vw;
        padding: 16px;
        background: linear-gradient(135deg, #2a2a2a, #232323);
        border: 1px solid #333333;
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }
      h1 {
        font-size: 26px;
        letter-spacing: 0.5px;
        margin: 0;
        color: var(--accent);
        text-shadow: none;
      }
      #hud {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 15px;
        flex-wrap: wrap;
      }
      .pill {
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      button {
        padding: 10px 14px;
        border-radius: 10px;
        border: none;
        background: linear-gradient(135deg, var(--accent), #3f7ec4);
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        transition: transform 0.1s ease, box-shadow 0.2s ease;
      }
      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      }
      #game-container {
        width: 100%;
        height: 620px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #1f1f1f;
        background: #1a1a1a;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1 id="game-title"></h1>
        <div id="hud">
          <div class="pill" id="score">Score: 0</div>
          <div class="pill" id="best-score">Best: 0</div>
          <div class="pill" id="timer">Time: 120s</div>
          <button id="new-game"></button>
        </div>
      </header>
      <div id="dev-panel" style="display:none; margin-bottom:8px; gap:8px; align-items:center;">
        <span style="color: var(--muted); font-size:13px;">Dev Mode</span>
        <label style="color: var(--muted); font-size:13px;">Type
          <select id="dev-type"></select>
        </label>
        <label style="color: var(--muted); font-size:13px;">Special
          <select id="dev-special">
            <option value="none">None</option>
            <option value="line-h">Line H</option>
            <option value="line-v">Line V</option>
            <option value="nova">Nova</option>
            <option value="supernova">Supernova</option>
          </select>
        </label>
        <button id="dev-toggle" style="padding:6px 10px;">Toggle Dev (D)</button>
        <button id="dev-reset" style="padding:6px 10px;">Reset Timer</button>
      </div>
      <div id="game-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
